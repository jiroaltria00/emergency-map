<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gov't Agencies Near Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#111; overflow:hidden; height:100vh; }

    #map { position:fixed; inset:0; z-index:1; }

    /* ── BACK BUTTON (chunky 3D) ── */
    .back-btn {
      position:fixed; top:14px; left:14px;
      background:linear-gradient(180deg,#3a3a3a 0%,#222 100%);
      border:none; border-radius:14px;
      width:42px; height:42px; font-size:22px; font-weight:800;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      box-shadow:0 5px 0px #111, 0 8px 16px rgba(0,0,0,0.5);
      z-index:100; color:#fff; transition:all 0.12s ease;
    }
    .back-btn:hover { background:linear-gradient(180deg,#444 0%,#2a2a2a 100%); }
    .back-btn:active { transform:translateY(4px); box-shadow:0 1px 0px #111; }

    /* ── LIVE BADGE (dark) ── */
    .live-badge {
      position:fixed; top:14px; left:50%; transform:translateX(-50%);
      background:rgba(20,20,20,0.92); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,0.1); border-radius:999px;
      padding:7px 18px; font-size:12px; font-weight:600; color:#fff;
      display:flex; align-items:center; gap:8px;
      z-index:100; box-shadow:0 2px 14px rgba(0,0,0,0.35); white-space:nowrap;
    }
    .live-dot {
      width:8px; height:8px; border-radius:50%; background:#ff4444;
      animation:pulse 1.5s infinite; flex-shrink:0;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(1.4);} }

    /* ── COORDS CARD (dark) ── */
    .coords-card {
      position:fixed; top:14px; right:14px;
      background:rgba(20,20,20,0.92); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,0.1); border-radius:14px;
      padding:12px 16px; z-index:100;
      box-shadow:0 4px 18px rgba(0,0,0,0.4); min-width:148px;
    }
    .coords-label { color:#666; font-size:9px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; }
    .coords-value { color:#fff; font-weight:700; font-size:13px; margin-bottom:5px; }
    .accuracy-row { display:flex; align-items:center; gap:5px; }
    .acc-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; flex-shrink:0; transition:background 0.3s; }
    .last-updated { font-size:9px; color:#555; margin-top:6px; font-weight:500; }

    @keyframes flash { 0%{opacity:1;} 40%{opacity:0.2;} 100%{opacity:1;} }
    .flashing { animation:flash 0.4s ease; }

    /* ── RECENTER (chunky 3D) ── */
    .recenter-btn {
      position:fixed; bottom:90px; right:16px;
      background:linear-gradient(180deg,#3a3a3a 0%,#222 100%);
      border:none; border-radius:14px;
      width:46px; height:46px; font-size:20px;
      cursor:pointer; box-shadow:0 5px 0px #111, 0 8px 16px rgba(0,0,0,0.4);
      z-index:100; display:flex; align-items:center; justify-content:center;
      transition:all 0.12s ease; color:#fff;
    }
    .recenter-btn:hover { background:linear-gradient(180deg,#444 0%,#2a2a2a 100%); }
    .recenter-btn:active { transform:translateY(4px); box-shadow:0 1px 0px #111; }

    /* ── OPEN PANEL FAB (chunky 3D) ── */
    .fab-btn {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      background:linear-gradient(180deg,#3a3a3a 0%,#222 100%);
      color:#fff; border:none; border-radius:18px;
      padding:14px 28px; font-size:13px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; gap:8px;
      box-shadow:0 6px 0px #111, 0 10px 24px rgba(0,0,0,0.5);
      z-index:100; transition:all 0.12s ease;
      white-space:nowrap; font-family:'Inter',sans-serif;
    }
    .fab-btn:hover { background:linear-gradient(180deg,#444 0%,#2a2a2a 100%); }
    .fab-btn:active { transform:translateX(-50%) translateY(5px); box-shadow:0 1px 0px #111; }
    .fab-btn.hidden { opacity:0; pointer-events:none; transform:translateX(-50%) translateY(20px); }



    /* ── SLIDE PANEL (dark) ── */
    .agencies-panel {
      position:fixed; bottom:0; left:0; right:0;
      background:#1a1a1a;
      border-radius:24px 24px 0 0;
      box-shadow:0 -8px 40px rgba(0,0,0,0.6);
      z-index:200;
      transform:translateY(100%);
      transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
      max-height:80vh; overflow-y:auto; scrollbar-width:none;
    }
    .agencies-panel::-webkit-scrollbar { display:none; }
    .agencies-panel.open { transform:translateY(0); }

    .panel-handle {
      display:flex; justify-content:center; padding:12px 0 0;
      position:sticky; top:0; background:#1a1a1a; z-index:2;
    }
    .handle-bar { width:40px; height:5px; background:#333; border-radius:999px; }

    .panel-inner { padding:14px 18px 36px; }

    .panel-top {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:18px;
    }
    .section-title { font-size:15px; font-weight:700; color:#fff; }

    .close-btn {
      background:linear-gradient(180deg,#3a3a3a 0%,#222 100%);
      border:none; border-radius:10px;
      width:32px; height:32px; font-size:14px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      color:#aaa; box-shadow:0 3px 0px #111;
      transition:all 0.12s ease;
    }
    .close-btn:hover { background:linear-gradient(180deg,#4a2020 0%,#2a1010 100%); color:#ff6666; }
    .close-btn:active { transform:translateY(2px); box-shadow:0 1px 0px #111; }

    /* ── CONTACT NUMBER INPUT ROW ── */
    .contact-input-section { margin-bottom:16px; }
    .contact-input-label { font-size:11px; color:#666; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:8px; }

    .contact-input-row {
      display:flex; gap:8px; align-items:center;
    }

    .contact-input {
      flex:1; background:#2a2a2a; border:1px solid #333;
      border-radius:16px; padding:12px 16px;
      font-size:14px; color:#fff; font-family:'Inter',sans-serif;
      outline:none; transition:border 0.15s;
    }
    .contact-input::placeholder { color:#555; }
    .contact-input:focus { border-color:#555; }

    .add-btn {
      background:linear-gradient(180deg,#55dd55 0%,#22aa22 100%);
      border:none; border-radius:14px;
      width:46px; height:46px; font-size:22px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 0px #117711, 0 6px 16px rgba(34,170,34,0.35);
      color:#fff; flex-shrink:0; transition:all 0.12s;
    }
    .add-btn:active { transform:translateY(3px); box-shadow:0 1px 0px #117711; }

    .del-btn {
      background:linear-gradient(180deg,#ffcc33 0%,#ddaa00 100%);
      border:none; border-radius:14px;
      width:46px; height:46px; font-size:20px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 0px #997700, 0 6px 16px rgba(221,170,0,0.35);
      color:#fff; flex-shrink:0; transition:all 0.12s;
    }
    .del-btn:active { transform:translateY(3px); box-shadow:0 1px 0px #997700; }

    /* saved contacts */
    .saved-contacts { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
    .saved-contact-row {
      display:flex; align-items:center; gap:10px;
      background:#242424; border-radius:14px; padding:10px 14px;
    }
    .saved-contact-num { flex:1; font-size:13px; color:#ddd; font-weight:500; }
    .saved-call-btn {
      background:linear-gradient(180deg,#c02020 0%,#8a1010 100%);
      color:#fff; border:none; border-radius:12px;
      padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;
      font-family:'Inter',sans-serif;
      box-shadow:0 4px 0px #4a0808;
      transition:all 0.12s ease;
    }
    .saved-call-btn:hover { background:linear-gradient(180deg,#d03030 0%,#9a2020 100%); }
    .saved-call-btn:active { transform:translateY(3px); box-shadow:0 1px 0px #4a0808; }

    .divider { height:1px; background:#2a2a2a; margin:18px 0; }

    .contact-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .contact-header-title { font-size:13px; font-weight:700; color:#aaa; }
    .see-all { font-size:12px; color:#ff5555; font-weight:600; cursor:pointer; }

    .contact-list { display:flex; flex-direction:column; gap:10px; }

    .contact-row {
      display:flex; align-items:center; gap:12px;
      padding:12px 14px; background:#242424; border-radius:14px;
      cursor:pointer; transition:background 0.15s;
    }
    .contact-row:hover { background:#2e2e2e; }

    .contact-icon {
      width:42px; height:42px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .contact-info { flex:1; }
    .contact-agency { font-size:13px; font-weight:600; color:#eee; }
    .contact-number { font-size:12px; color:#666; margin-top:2px; }

    .call-btn {
      background:linear-gradient(180deg,#c02020 0%,#8a1010 100%);
      color:#fff; border:none; border-radius:12px;
      padding:8px 16px; font-size:12px; font-weight:700; cursor:pointer;
      white-space:nowrap; font-family:'Inter',sans-serif;
      box-shadow:0 4px 0px #4a0808, 0 6px 14px rgba(180,20,20,0.3);
      transition:all 0.12s ease;
    }
    .call-btn:hover { background:linear-gradient(180deg,#d03030 0%,#9a2020 100%); }
    .call-btn:active { transform:translateY(3px); box-shadow:0 1px 0px #4a0808; }
    .call-btn.no-num { background:linear-gradient(180deg,#333 0%,#222 100%); color:#555; cursor:default; box-shadow:0 4px 0px #111; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- BACK -->
  <button class="back-btn" onclick="history.back()">‹</button>

  <!-- LIVE BADGE -->
  <div class="live-badge">
    <div class="live-dot"></div>
    Live location active
  </div>

  <!-- COORDS -->
  <div class="coords-card">
    <div class="coords-label">Latitude</div>
    <div class="coords-value" id="latVal">Locating...</div>
    <div class="coords-label">Longitude</div>
    <div class="coords-value" id="lngVal">—</div>
    <div class="coords-label">Accuracy</div>
    <div class="accuracy-row">
      <div class="acc-dot" id="accDot"></div>
      <div class="coords-value" id="accVal" style="margin:0">—</div>
    </div>
    <div class="last-updated" id="lastUpdated">Waiting for GPS...</div>
  </div>

  <!-- RECENTER -->
  <button class="recenter-btn" onclick="recenter()">📍</button>

  <!-- OPEN PANEL -->
  <button class="fab-btn" id="fabBtn" onclick="openPanel()">🏛️ Gov't Agencies near Me ▲</button>



  <!-- PANEL -->
  <div class="agencies-panel" id="agenciesPanel">
    <div class="panel-handle"><div class="handle-bar"></div></div>
    <div class="panel-inner">

      <div class="panel-top">
        <div class="section-title">Gov't Agencies near Me</div>
        <button class="close-btn" onclick="closePanel()">✕</button>
      </div>

      <!-- Contact number input -->
      <div class="contact-input-section">
        <div class="contact-input-label">Emergency Contact Number</div>
        <div class="contact-input-row">
          <input class="contact-input" id="contactInput" type="tel" placeholder="Contact Number" />
          <button class="add-btn" onclick="addContact()" title="Add">+</button>
          <button class="del-btn" onclick="deleteLastContact()" title="Delete">🗑</button>
        </div>
        <div class="saved-contacts" id="savedContacts"></div>
      </div>

      <div class="divider"></div>

      <div class="contact-header">
        <div class="contact-header-title" id="contactTitle">Nearby Agencies</div>
        <div class="see-all" onclick="renderNearbyPanel()">See all</div>
      </div>
      <div class="contact-list" id="contactList">
        <div style="text-align:center;color:#555;padding:24px;font-size:13px;">Getting your location...<br>Agencies will appear shortly 🗺️</div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── CATEGORY CONFIG ──
    const categoryConfig = {
      police:     { icon:'🚔', color:'#1e3a5f', label:'Police' },
      fire:       { icon:'🚒', color:'#5f1e1e', label:'Fire Station' },
      hospital:   { icon:'🏥', color:'#1e4a2a', label:'Hospital' },
      clinic:     { icon:'🏨', color:'#1e3a4a', label:'Clinic' },
      government: { icon:'🏛️', color:'#2e2a4a', label:'Gov\'t Office' },
      barangay:   { icon:'🏘️', color:'#3a3a1e', label:'Barangay Hall' },
      disaster:   { icon:'🛡️', color:'#3a2a1e', label:'DRRM / Rescue' },
      other:      { icon:'📍', color:'#2a2a2a', label:'Agency' },
    };

    // ── MAP ──
    const map = L.map('map', { zoomControl:false, attributionControl:true })
      .setView([15.4738, 120.6053], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom:19
    }).addTo(map);

    L.control.zoom({ position:'bottomright' }).addTo(map);

    // ── YOU MARKER ──
    const youIcon = L.divIcon({
      className:'',
      html:`<div style="width:18px;height:18px;background:#ff3333;border-radius:50%;border:3px solid white;box-shadow:0 2px 10px rgba(255,50,50,0.7);position:relative;">
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,50,50,0.15);"></div>
      </div>`,
      iconSize:[18,18], iconAnchor:[9,9]
    });

    let youMarker = null, accuracyCircle = null;
    let overpassMarkers = [], nearbyAgencies = [], fetchedForLocation = false;

    // ── CLASSIFIER ──
    function classify(tags) {
      const name = (tags.name||'').toLowerCase();
      const amenity = tags.amenity||'';
      const govt = tags.government||'';
      const office = tags.office||'';
      if (amenity==='police'||name.includes('pnp')||name.includes('police')) return 'police';
      if (amenity==='fire_station'||name.includes('fire')||name.includes('bfp')) return 'fire';
      if (amenity==='hospital'||name.includes('hospital')) return 'hospital';
      if (amenity==='clinic'||amenity==='health'||name.includes('clinic')||name.includes('health center')) return 'clinic';
      if (name.includes('barangay')||name.includes('brgy')||govt==='local_authority') return 'barangay';
      if (name.includes('drrm')||name.includes('disaster')||name.includes('rescue')||name.includes('ndrrmc')) return 'disaster';
      if (office==='government'||govt||amenity==='townhall'||name.includes('municipal')||name.includes('city hall')||name.includes('capitol')) return 'government';
      return 'other';
    }

    // ── OVERPASS ──
    async function fetchNearbyAgencies(lat, lng) {
      const radius = 5000;
      const query = `[out:json][timeout:25];(
        node["amenity"="police"](around:${radius},${lat},${lng});
        node["amenity"="fire_station"](around:${radius},${lat},${lng});
        node["amenity"="hospital"](around:${radius},${lat},${lng});
        node["amenity"="clinic"](around:${radius},${lat},${lng});
        node["amenity"="townhall"](around:${radius},${lat},${lng});
        node["office"="government"](around:${radius},${lat},${lng});
        node["government"](around:${radius},${lat},${lng});
        node["name"~"barangay|BARANGAY|Barangay|brgy|PNP|BFP|NDRRMC|fire|hospital|Municipal|Capitol|DRRM",i](around:${radius},${lat},${lng});
        way["amenity"="police"](around:${radius},${lat},${lng});
        way["amenity"="fire_station"](around:${radius},${lat},${lng});
        way["amenity"="hospital"](around:${radius},${lat},${lng});
        way["amenity"="townhall"](around:${radius},${lat},${lng});
        way["office"="government"](around:${radius},${lat},${lng});
      );out center;`;

      try {
        document.getElementById('lastUpdated').textContent = 'Searching agencies...';
        const res = await fetch('https://overpass-api.de/api/interpreter', { method:'POST', body:query });
        const data = await res.json();

        overpassMarkers.forEach(m => map.removeLayer(m));
        overpassMarkers = []; nearbyAgencies = [];

        data.elements.forEach(el => {
          const name = el.tags?.name;
          if (!name) return;
          const elLat = el.lat ?? el.center?.lat;
          const elLng = el.lon ?? el.center?.lon;
          if (!elLat || !elLng) return;

          const cat = classify(el.tags);
          const cfg = categoryConfig[cat];
          const phone = el.tags?.phone || el.tags?.['contact:phone'] || '—';

          nearbyAgencies.push({ name, lat:elLat, lng:elLng, cat, cfg, phone });

          const icon = L.divIcon({
            className:'',
            html:`<div style="width:36px;height:36px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 12px rgba(0,0,0,0.5);border:2px solid #333;">${cfg.icon}</div>`,
            iconSize:[36,36], iconAnchor:[18,18], popupAnchor:[0,-20]
          });

          const marker = L.marker([elLat,elLng],{icon}).addTo(map).bindPopup(`
            <div style="font-family:Inter,sans-serif;min-width:150px;background:#1e1e1e;color:#fff;border-radius:10px;padding:4px;">
              <div style="font-weight:700;font-size:13px;margin-bottom:4px;">${cfg.icon} ${name}</div>
              <div style="font-size:11px;color:#888;margin-bottom:4px;">${cfg.label}</div>
              ${phone!=='—'?`<div style="font-size:12px;color:#aaa;">📞 ${phone}</div>`:''}
            </div>`);
          overpassMarkers.push(marker);
        });

        renderNearbyPanel();
        document.getElementById('lastUpdated').textContent = `Found ${nearbyAgencies.length} agencies nearby`;
      } catch(e) {
        document.getElementById('lastUpdated').textContent = 'Could not load agencies';
      }
    }

    // ── RENDER PANEL ──
    function renderNearbyPanel() {
      const list = document.getElementById('contactList');
      list.innerHTML = '';
      document.getElementById('contactTitle').textContent = `Nearby Agencies (${nearbyAgencies.length})`;

      if (!nearbyAgencies.length) {
        list.innerHTML = `<div style="text-align:center;color:#555;padding:24px;font-size:13px;">No agencies found nearby.</div>`;
        return;
      }

      nearbyAgencies.forEach((a,i) => {
        list.innerHTML += `
          <div class="contact-row" onclick="flyToAgency(${i})">
            <div class="contact-icon" style="background:${a.cfg.color}">${a.cfg.icon}</div>
            <div class="contact-info">
              <div class="contact-agency">${a.name}</div>
              <div class="contact-number">${a.cfg.label}${a.phone!=='—'?' · '+a.phone:''}</div>
            </div>
            ${a.phone!=='—'
              ? `<button class="call-btn" onclick="event.stopPropagation();window.location.href='tel:${a.phone.replace(/[^0-9+]/g,'')}'">Call</button>`
              : `<button class="call-btn no-num">📍</button>`}
          </div>`;
      });
    }

    function flyToAgency(i) {
      const a = nearbyAgencies[i];
      map.flyTo([a.lat,a.lng],18,{duration:1});
      closePanel();
    }

    // ── GPS ──
    function flash(id) {
      const el = document.getElementById(id); if(!el) return;
      el.classList.remove('flashing'); void el.offsetWidth; el.classList.add('flashing');
      setTimeout(()=>el.classList.remove('flashing'),400);
    }

    function updateTime() {
      const t = new Date();
      const str = [t.getHours(),t.getMinutes(),t.getSeconds()].map(n=>n.toString().padStart(2,'0')).join(':');
      document.getElementById('lastUpdated').textContent = `Last updated ${str}`;
    }

    function onPosition(pos) {
      const {latitude:lat, longitude:lng, accuracy:acc} = pos.coords;
      document.getElementById('latVal').textContent = lat.toFixed(6);
      document.getElementById('lngVal').textContent = lng.toFixed(6);
      document.getElementById('accVal').textContent = Math.round(acc)+'m';
      flash('latVal'); flash('lngVal'); updateTime();
      document.getElementById('accDot').style.background = acc<20?'#22c55e':acc<60?'#f59e0b':'#ef4444';

      const latlng = [lat,lng];
      if (!youMarker) {
        youMarker = L.marker(latlng,{icon:youIcon,zIndexOffset:1000}).addTo(map);
        map.setView(latlng,15);
        if (!fetchedForLocation) { fetchNearbyAgencies(lat,lng); fetchedForLocation=true; }
      } else { youMarker.setLatLng(latlng); }

      if (accuracyCircle) map.removeLayer(accuracyCircle);
      accuracyCircle = L.circle(latlng,{radius:acc,color:'#ff3333',fillColor:'#ff3333',fillOpacity:0.07,weight:1.5}).addTo(map);
    }

    function onError() {
      document.getElementById('latVal').textContent = 'Access denied';
      document.getElementById('lngVal').textContent = '—';
      document.getElementById('lastUpdated').textContent = 'Allow location access';
      document.getElementById('accDot').style.background = '#ef4444';
      if (!fetchedForLocation) { fetchNearbyAgencies(15.4738,120.6053); fetchedForLocation=true; }
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(onPosition,onError,{enableHighAccuracy:true,timeout:8000,maximumAge:0});
      navigator.geolocation.watchPosition(onPosition,onError,{enableHighAccuracy:true,timeout:8000,maximumAge:3000});
    } else {
      document.getElementById('latVal').textContent = 'Not supported';
      fetchNearbyAgencies(15.4738,120.6053);
    }

    function recenter() { if(youMarker) map.setView(youMarker.getLatLng(),16); }

    // ── PANEL ──
    function openPanel() {
      document.getElementById('agenciesPanel').classList.add('open');
      document.getElementById('fabBtn').classList.add('hidden');
    }
    function closePanel() {
      document.getElementById('agenciesPanel').classList.remove('open');
      document.getElementById('fabBtn').classList.remove('hidden');
    }

    let startY=0;
    document.getElementById('agenciesPanel').addEventListener('touchstart',e=>{startY=e.touches[0].clientY;});
    document.getElementById('agenciesPanel').addEventListener('touchend',e=>{
      if(e.changedTouches[0].clientY-startY>60) closePanel();
    });

    // ── CONTACTS ──
    let savedContacts = [];

    function addContact() {
      const input = document.getElementById('contactInput');
      const val = input.value.trim();
      if (!val) return;
      savedContacts.push(val);
      input.value = '';
      renderSavedContacts();
    }

    function deleteLastContact() {
      if (!savedContacts.length) return;
      savedContacts.pop();
      renderSavedContacts();
    }

    function renderSavedContacts() {
      const el = document.getElementById('savedContacts');
      el.innerHTML = '';
      savedContacts.forEach((num,i) => {
        el.innerHTML += `
          <div class="saved-contact-row">
            <span style="font-size:16px">👤</span>
            <span class="saved-contact-num">${num}</span>
            <button class="saved-call-btn" onclick="window.location.href='tel:${num.replace(/[^0-9+]/g,'')}'" >Call</button>
            <button style="background:none;border:none;color:#555;font-size:16px;cursor:pointer;padding:0 4px;" onclick="savedContacts.splice(${i},1);renderSavedContacts()">✕</button>
          </div>`;
      });
    }


  </script>
</body>
</html>
